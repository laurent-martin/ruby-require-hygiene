name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        include:
          - os: macos-latest
            ruby: "4.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Tests and lint
        run: bundle exec rake

      - name: The gem checks itself
        run: bundle exec bin/require_hygiene analyze lib

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.ruby == '4.0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/

  audit:
    name: Dependency audit and API documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Known vulnerabilities in dependencies
        run: bundle exec bundler-audit check --update

      - name: API documentation has no warning
        run: bundle exec rake yard:check

  package:
    name: Build and install the gem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build, install and run
        run: |
          gem build require_hygiene.gemspec --output /tmp/require_hygiene.gem
          gem install --local /tmp/require_hygiene.gem
          require_hygiene version
