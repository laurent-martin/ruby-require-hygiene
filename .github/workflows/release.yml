# Create a release: version, changelog, commit, tag, GitHub release. The tag triggers deploy.yml.
# Triggered manually from the GitHub Actions page.
name: New Release on GitHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z). Empty: version of version.rb without .pre"
        required: false
        type: string
      next_version:
        description: "Next development version (x.y.z, .pre is added). Empty: next minor version"
        required: false
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A token other than GITHUB_TOKEN is required: a tag pushed with GITHUB_TOKEN does not trigger deploy.yml.
      # RELEASE_TOKEN: personal access token (or GitHub App token) with write access to contents of this repository.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: bundle exec rake release:run'[${{ inputs.version }},${{ inputs.next_version }}]'
